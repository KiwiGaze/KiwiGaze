<svg xmlns="http://www.w3.org/2000/svg" width="420" height="132" viewBox="0 0 420 132" role="img" aria-label="project ~/OmniSearches: Free, open-source AI search engine — answers with">

  <style>
    text { font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
    .a { opacity: 0; animation: ap 0.01s steps(1) forwards; }
    @keyframes ap { to { opacity: 1; } }
    .cur { animation: bl 1.1s steps(1) infinite; }
    @keyframes bl { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .a { animation: none; opacity: 1; }
      .cur { animation: none; }
    }
  </style>
  <defs>
    <pattern id="scan" width="2" height="3" patternUnits="userSpaceOnUse">
      <rect y="2" width="2" height="1" fill="#000000" opacity="0.16"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.4" flood-color="#00e69a" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="0.75" y="0.75" width="418.5" height="130.5" rx="10" fill="#0f1512" stroke="#1e2c25" stroke-width="1.5"/>
  <path d="M 8 18 L 8 8 L 18 8" fill="none" stroke="#00e69a" stroke-width="2" opacity="0.9"/>
