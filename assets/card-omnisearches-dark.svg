  <path d="M 8 114 L 8 124 L 18 124" fill="none" stroke="#00e69a" stroke-width="2" opacity="0.9"/>
  <path d="M 412 114 L 412 124 L 402 124" fill="none" stroke="#00e69a" stroke-width="2" opacity="0.9"/>
